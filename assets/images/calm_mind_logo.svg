<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas: Zen Linen / Warm Cream -->
    <radialGradient id="lotusBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FCFAF5" />
      <stop offset="65%" stop-color="#F5F1E6" />
      <stop offset="100%" stop-color="#E8E1D2" />
    </radialGradient>

    <!-- Japanese Brushstroke Ensō Gradient -->
    <linearGradient id="ensoBrush" x1="200" y1="180" x2="824" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#567E63" />
      <stop offset="35%" stop-color="#466850" />
      <stop offset="75%" stop-color="#314E3A" />
      <stop offset="100%" stop-color="#213527" />
    </linearGradient>

    <!-- Center Lotus Petal: Luminous Sage with Soft Light -->
    <linearGradient id="cPetal" x1="512" y1="360" x2="512" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6E987A" />
      <stop offset="45%" stop-color="#4E7358" />
      <stop offset="100%" stop-color="#35533E" />
    </linearGradient>

    <!-- Flanking Symmetrical Petals -->
    <linearGradient id="lPetal" x1="380" y1="440" x2="490" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#588064" />
      <stop offset="100%" stop-color="#34523C" />
    </linearGradient>

    <linearGradient id="rPetal" x1="644" y1="440" x2="534" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#588064" />
      <stop offset="100%" stop-color="#34523C" />
    </linearGradient>

    <!-- Warm Terracotta Morning Sun Seed -->
    <linearGradient id="dawnSun" x1="512" y1="270" x2="512" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E59974" />
      <stop offset="100%" stop-color="#B36D48" />
    </linearGradient>

    <!-- Tactile Physical Shadow -->
    <filter id="lotusShadow" x="120" y="130" width="784" height="784" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#28221B" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#28221B" flood-opacity="0.06" />
    </filter>

    <filter id="sunGlow" x="460" y="260" width="104" height="114" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#B36D48" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1024" height="1024" rx="228" fill="url(#lotusBg)" />
  <rect x="2" y="2" width="1020" height="1020" rx="226" stroke="#E2DACB" stroke-width="3" fill="none" opacity="0.6" />

  <g filter="url(#lotusShadow)">
    <!-- 1. The Calligraphic Zen Ensō Arch -->
    <path 
      d="M 610 210
         C 455 185 295 245 208 375
         C 115 515 130 705 252 815
         C 375 925 570 925 698 830
         C 825 735 875 550 832 395
         C 824 365 788 372 792 400
         C 828 535 778 695 665 775
         C 550 855 380 848 280 750
         C 180 652 165 490 248 375
         C 325 265 465 212 590 235
         C 615 240 625 205 610 210
         Z" 
      fill="url(#ensoBrush)" 
    />

    <!-- 2. Left Botanical Petal (Mindful Openness) -->
    <path 
      d="M 512 690
         C 440 675 365 590 360 475
         C 358 432 380 405 405 408
         C 448 412 492 510 512 690
         Z" 
      fill="url(#lPetal)" 
    />

    <!-- 3. Right Botanical Petal (Kind Presence) -->
    <path 
      d="M 512 690
         C 584 675 659 590 664 475
         C 666 432 644 405 619 408
         C 576 412 532 510 512 690
         Z" 
      fill="url(#rPetal)" 
    />

    <!-- 4. Center Heart Petal (The Ascending Breath) -->
    <path 
      d="M 512 365
         C 555 440 578 545 550 685
         C 538 712 486 712 474 685
         C 446 545 469 440 512 365
         Z" 
      fill="url(#cPetal)" 
    />

    <!-- Center Petal Spine of Light -->
    <path 
      d="M 512 395 L 512 670" 
      stroke="#FAF8F3" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      opacity="0.5" 
    />

    <!-- 5. Water / Base Mindfulness Ripple -->
    <path 
      d="M 390 735
         C 460 755 564 755 634 735" 
      stroke="#466850" 
      stroke-width="7" 
      stroke-linecap="round" 
      opacity="0.6"
    />
  </g>

  <!-- 6. Golden Morning Sun (Mindful Awakening / Focal Point) -->
  <g filter="url(#sunGlow)">
    <circle cx="512" cy="300" r="32" fill="url(#dawnSun)" />
  </g>
</svg>
